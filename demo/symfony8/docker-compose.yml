name: mail-kit-bundle-demo-symfony-8
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mail-kit-demo-symfony8-php
    working_dir: /app
    restart: unless-stopped
    ports:
      # Loopback only: the demo opens the mail admin UI without login.
      - "127.0.0.1:${PORT:-8085}:80"
    volumes:
      - .:/app
      - ../..:/var/mail-kit-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
      - APP_DEBUG=1
      - APP_SECRET=${APP_SECRET:-demo-secret}
      - FRANKENPHP_MODE=${FRANKENPHP_MODE:-worker}
      - DATABASE_URL=${DATABASE_URL:-mysql://mailkit:mailkit@db:3306/mail_kit_demo?serverVersion=8.0&charset=utf8mb4}
      - MAILER_DSN=${MAILER_DSN:-null://null}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - mail-kit-demo-network

  db:
    image: mysql:8.0
    container_name: mail-kit-demo-symfony8-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mail_kit_demo
      MYSQL_USER: mailkit
      MYSQL_PASSWORD: mailkit
    volumes:
      - mysql_data:/var/lib/mysql
    # REQ-DEMO-006: no host port — access only via the Docker network.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umailkit", "-pmailkit"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mail-kit-demo-network

  # Mail catcher: the demo stores smtp://mailpit:1025 as the runtime DSN (dsn.allowed_hosts: [mailpit]).
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: mail-kit-demo-symfony8-mailpit
    ports:
      # Web UI on loopback only; SMTP (1025) stays on the Docker network.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8087}:8025"
    expose:
      - "1025"
    networks:
      - mail-kit-demo-network

volumes:
  composer-cache:
  mysql_data:

networks:
  mail-kit-demo-network:
    driver: bridge
