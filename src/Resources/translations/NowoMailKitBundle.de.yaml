settings:
    mailer:
        label: Ausgehende E-Mail
        intro: 'Ausgehende E-Mail dieser Instanz. Ein hier gespeicherter DSN ersetzt MAILER_DSN ab der nächsten Nachricht, ohne Deployment; leer lassen, um MAILER_DSN zu verwenden.'
        dsn: Mailer-DSN
        dsn_help: 'Zum Beispiel smtp://benutzer:passwort@smtp.example.com:587 oder resend+api://SCHLÜSSEL@default. Verschlüsselt gespeichert; sendmail, native und null werden abgelehnt, private Hosts ebenfalls, sofern nicht erlaubt.'
        from: Absenderadresse
        from_help: 'Wird verwendet, wenn eine Nachricht kein From hat. Muss auf einer öffentlichen Domain liegen.'
        from_name: Absendername
        reply_to: Reply-To-Adresse
        reply_to_help: 'Wird ergänzt, wenn eine Nachricht kein Reply-To hat.'
        test_recipient: Testempfänger
        test_recipient_help: 'Erhält die Test-E-Mails (Standard: Ihre eigene Adresse).'
        action:
            send_test: Test-E-Mail senden
    resend:
        label: Resend
        intro: 'Sendet über die Resend-API statt über den DSN, solange dieser Abschnitt aktiviert ist und einen Schlüssel enthält (benötigt symfony/resend-mailer).'
        enabled: Mit Resend senden
        enabled_help: 'Wirkt nur mit einem gespeicherten API-Schlüssel.'
        api_key: API-Schlüssel
        api_key_help: 'Verschlüsselt gespeichert. Ein reiner Sende-Schlüssel genügt.'
        from: Resend-Absender
        from_help: 'Eine in Resend verifizierte Domain (Standard: die Mailer-Absenderadresse).'
        action:
            check: API-Schlüssel prüfen
            send_test: Test-E-Mail mit Resend senden
