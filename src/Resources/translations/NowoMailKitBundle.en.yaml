        status: Status
        subject: Subject
        to: To
        tag: Tag
        transport: Transport
    status:
        queued: Queued
        sent: Sent
        failed: Failed
    filter:
        q: Search
        q_placeholder: 'Subject or recipient'
        status: Status
        status_any: 'Any status'
        period:
