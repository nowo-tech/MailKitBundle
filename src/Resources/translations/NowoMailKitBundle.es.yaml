settings:
    mailer:
        label: Correo saliente
        intro: 'Correo saliente de esta instancia. Un DSN guardado aquí sustituye a MAILER_DSN en el siguiente mensaje, sin despliegue; déjalo vacío para usar MAILER_DSN.'
        dsn: DSN del mailer
        dsn_help: 'Por ejemplo smtp://usuario:contraseña@smtp.example.com:587 o resend+api://CLAVE@default. Se guarda cifrado; se rechazan sendmail, native y null, y también los hosts privados salvo que estén permitidos.'
        from: Dirección del remitente
        from_help: 'Se usa cuando un mensaje no tiene From. Debe estar en un dominio público.'
        from_name: Nombre del remitente
        reply_to: Dirección Reply-To
        reply_to_help: 'Se añade cuando un mensaje no tiene Reply-To.'
        test_recipient: Destinatario de prueba
        test_recipient_help: 'Recibe los correos de prueba (por defecto: tu propia dirección).'
        action:
            send_test: Enviar un correo de prueba
    resend:
        label: Resend
        intro: 'Envía mediante la API de Resend en lugar del DSN mientras esta sección esté activada y tenga una clave (requiere symfony/resend-mailer).'
        enabled: Enviar con Resend
        enabled_help: 'Solo tiene efecto con una clave de API guardada.'
        api_key: Clave de API
        api_key_help: 'Se guarda cifrada. Basta con una clave solo de envío.'
        from: Remitente de Resend
        from_help: 'Un dominio verificado en Resend (por defecto: el remitente del mailer).'
        action:
            check: Comprobar la clave de API
            send_test: Enviar un correo de prueba con Resend
