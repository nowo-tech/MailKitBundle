settings:
    mailer:
        label: E-mail sortant
        intro: "E-mail sortant de cette instance. Un DSN enregistré ici remplace MAILER_DSN dès le message suivant, sans déploiement ; laissez-le vide pour utiliser MAILER_DSN."
        dsn: DSN du mailer
        dsn_help: "Par exemple smtp://utilisateur:motdepasse@smtp.example.com:587 ou resend+api://CLÉ@default. Stocké chiffré ; sendmail, native et null sont refusés, ainsi que les hôtes privés sauf autorisation."
        from: Adresse de l'expéditeur
        from_help: "Utilisée quand un message n'a pas de From. Doit être sur un domaine public."
        from_name: Nom de l'expéditeur
        reply_to: Adresse Reply-To
        reply_to_help: "Ajoutée quand un message n'a pas de Reply-To."
        test_recipient: Destinataire de test
        test_recipient_help: 'Reçoit les e-mails de test (par défaut : votre propre adresse).'
        action:
            send_test: Envoyer un e-mail de test
    resend:
        label: Resend
        intro: "Envoie via l'API Resend au lieu du DSN tant que cette section est activée et contient une clé (nécessite symfony/resend-mailer)."
        enabled: Envoyer avec Resend
        enabled_help: "N'a d'effet qu'avec une clé d'API enregistrée."
        api_key: Clé d'API
        api_key_help: "Stockée chiffrée. Une clé d'envoi seul suffit."
        from: Expéditeur Resend
        from_help: "Un domaine vérifié dans Resend (par défaut : l'expéditeur du mailer)."
        action:
            check: Vérifier la clé d'API
            send_test: Envoyer un e-mail de test avec Resend
dsn:
    invalid: 'Ce DSN de mailer est illisible.'
    null_transport: "null:// supprimerait tous les messages ; laissez le champ vide pour utiliser MAILER_DSN."
    scheme_not_allowed: "Ce schéma de DSN n'est pas autorisé."
    unsupported: 'Aucun bridge de mailer installé ne prend en charge ce schéma (par exemple : composer require symfony/resend-mailer).'
    host_not_allowed: "L'hôte de ce serveur de messagerie est privé, local ou réservé et n'est pas autorisé."
    host_unresolvable: "Le nom d'hôte de ce serveur de messagerie ne se résout pas."
    option_not_allowed: "Une option de ce DSN n'est pas autorisée (région hors de la liste du fournisseur, ou valeur pouvant changer l'adresse du serveur)."
    insecure_tls: 'Ce DSN désactive la vérification des certificats TLS (verify_peer) ; autorisé seulement avec dsn.allow_insecure_tls en développement.'
