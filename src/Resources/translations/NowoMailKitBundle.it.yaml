settings:
    mailer:
        label: Posta in uscita
        intro: "Posta in uscita di questa istanza. Un DSN salvato qui sostituisce MAILER_DSN dal messaggio successivo, senza deploy; lascialo vuoto per usare MAILER_DSN."
        dsn: DSN del mailer
        dsn_help: "Per esempio smtp://utente:password@smtp.example.com:587 o resend+api://CHIAVE@default. Salvato cifrato; sendmail, native e null sono rifiutati, così come gli host privati se non consentiti."
        from: Indirizzo del mittente
        from_help: "Usato quando un messaggio non ha From. Deve essere su un dominio pubblico."
        from_name: Nome del mittente
        reply_to: Indirizzo Reply-To
        reply_to_help: "Aggiunto quando un messaggio non ha Reply-To."
        test_recipient: Destinatario di prova
        test_recipient_help: "Riceve le e-mail di prova (predefinito: il tuo indirizzo)."
        action:
            send_test: Invia un'e-mail di prova
    resend:
        label: Resend
        intro: "Invia tramite l'API di Resend invece del DSN finché questa sezione è attiva e contiene una chiave (richiede symfony/resend-mailer)."
        enabled: Invia con Resend
        enabled_help: "Ha effetto solo con una chiave API salvata."
        api_key: Chiave API
        api_key_help: "Salvata cifrata. Basta una chiave di solo invio."
        from: Mittente Resend
        from_help: "Un dominio verificato in Resend (predefinito: il mittente del mailer)."
        action:
            check: Verifica la chiave API
            send_test: Invia un'e-mail di prova con Resend
