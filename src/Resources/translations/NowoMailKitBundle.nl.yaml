settings:
    notice_missing: 'Verplichte instellingen zijn leeg: %fields%. Uitgaande e-mail is pas klaar als ze zijn ingevuld.'
    mailer:
        label: Uitgaande e-mail
        intro: 'Uitgaande e-mail van deze instantie. Een hier opgeslagen DSN vervangt MAILER_DSN vanaf het volgende bericht, zonder deploy; laat het leeg om MAILER_DSN te gebruiken.'
        intro_providers: 'Uitgaande e-mail van deze instantie. Kies de provider: alleen de velden daarvan worden getoond en opgeslagen, de andere provider houdt zijn opgeslagen waarden. Met de DSN-provider zonder opgeslagen DSN wordt MAILER_DSN gebruikt.'
        provider: Provider
        provider_help: 'Resend vereist symfony/resend-mailer. Bij overschakelen naar Resend wordt de API-sleutel vóór het opslaan bij Resend gecontroleerd.'
        provider_dsn: 'SMTP of een andere mailer-DSN'
        provider_resend: 'Resend-API'
        resend_api_key: Resend-API-sleutel
        resend_api_key_help: 'Versleuteld opgeslagen. Een sleutel die alleen mag verzenden is genoeg. Wordt vóór het opslaan bij Resend gecontroleerd; laat leeg om de opgeslagen sleutel te houden.'
        resend_from: Resend-afzenderadres
        resend_from_help: 'Een geverifieerd domein in Resend (standaard: het afzenderadres).'
        notice_legacy_resend: 'De Resend-instellingen van MailKit 1.2 worden nog uit de oude sectie resend gelezen. Voer bin/console nowo:instance-settings:seed-from-fallbacks --section=mailer uit om ze hierheen te verplaatsen voordat je deze pagina opslaat.'
        dsn: Mailer-DSN
        dsn_help: 'Bijvoorbeeld smtp://gebruiker:wachtwoord@smtp.example.com:587 of resend+api://SLEUTEL@default. Versleuteld opgeslagen; sendmail, native en null worden geweigerd, privé-hosts ook tenzij toegestaan.'
        from: Afzenderadres
        from_help: 'Gebruikt wanneer een bericht geen From heeft. Moet op een publiek domein staan.'
        from_name: Afzendernaam
        reply_to: Reply-To-adres
        reply_to_help: 'Toegevoegd wanneer een bericht geen Reply-To heeft.'
        test_recipient: Testontvanger
        test_recipient_help: 'Ontvangt de test-e-mails (standaard: uw eigen adres).'
        action:
            send_test: Een test-e-mail versturen
    resend:
        action:
            check: API-sleutel controleren
            send_test: Een test-e-mail versturen met Resend
