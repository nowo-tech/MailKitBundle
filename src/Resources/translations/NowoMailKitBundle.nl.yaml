settings:
    mailer:
        label: Uitgaande e-mail
        intro: 'Uitgaande e-mail van deze instantie. Een hier opgeslagen DSN vervangt MAILER_DSN vanaf het volgende bericht, zonder deploy; laat het leeg om MAILER_DSN te gebruiken.'
        dsn: Mailer-DSN
        dsn_help: 'Bijvoorbeeld smtp://gebruiker:wachtwoord@smtp.example.com:587 of resend+api://SLEUTEL@default. Versleuteld opgeslagen; sendmail, native en null worden geweigerd, privé-hosts ook tenzij toegestaan.'
        from: Afzenderadres
        from_help: 'Gebruikt wanneer een bericht geen From heeft. Moet op een publiek domein staan.'
        from_name: Afzendernaam
        reply_to: Reply-To-adres
        reply_to_help: 'Toegevoegd wanneer een bericht geen Reply-To heeft.'
        test_recipient: Testontvanger
        test_recipient_help: 'Ontvangt de test-e-mails (standaard: uw eigen adres).'
        action:
            send_test: Een test-e-mail versturen
    resend:
        label: Resend
        intro: 'Verstuurt via de Resend-API in plaats van de DSN zolang deze sectie aan staat en een sleutel bevat (vereist symfony/resend-mailer).'
        enabled: Versturen met Resend
        enabled_help: 'Werkt alleen met een opgeslagen API-sleutel.'
        api_key: API-sleutel
        api_key_help: 'Versleuteld opgeslagen. Een sleutel die alleen mag versturen volstaat.'
        from: Resend-afzender
        from_help: 'Een in Resend geverifieerd domein (standaard: het afzenderadres van de mailer).'
        action:
            check: API-sleutel controleren
            send_test: Een test-e-mail versturen met Resend
