settings:
    mailer:
        label: Correio de saída
        intro: 'Correio de saída desta instância. Um DSN guardado aqui substitui MAILER_DSN na mensagem seguinte, sem deploy; deixe-o vazio para usar MAILER_DSN.'
        dsn: DSN do mailer
        dsn_help: 'Por exemplo smtp://utilizador:palavra-passe@smtp.example.com:587 ou resend+api://CHAVE@default. Guardado cifrado; sendmail, native e null são recusados, assim como hosts privados salvo se permitidos.'
        from: Endereço do remetente
        from_help: 'Usado quando uma mensagem não tem From. Deve estar num domínio público.'
        from_name: Nome do remetente
        reply_to: Endereço Reply-To
        reply_to_help: 'Adicionado quando uma mensagem não tem Reply-To.'
        test_recipient: Destinatário de teste
        test_recipient_help: 'Recebe os e-mails de teste (por omissão: o seu próprio endereço).'
        action:
            send_test: Enviar um e-mail de teste
    resend:
        label: Resend
        intro: 'Envia pela API da Resend em vez do DSN enquanto esta secção estiver ativa e tiver uma chave (requer symfony/resend-mailer).'
        enabled: Enviar com Resend
        enabled_help: 'Só tem efeito com uma chave de API guardada.'
        api_key: Chave de API
        api_key_help: 'Guardada cifrada. Basta uma chave só de envio.'
        from: Remetente Resend
        from_help: 'Um domínio verificado na Resend (por omissão: o remetente do mailer).'
        action:
            check: Verificar a chave de API
            send_test: Enviar um e-mail de teste com Resend
dsn:
    invalid: 'Não é possível interpretar este DSN do mailer.'
    null_transport: 'null:// descartaria todas as mensagens; deixe o campo vazio para usar MAILER_DSN.'
    scheme_not_allowed: 'Este esquema de DSN não é permitido.'
    unsupported: 'Nenhum bridge de mailer instalado suporta este esquema (por exemplo: composer require symfony/resend-mailer).'
    host_not_allowed: 'O host deste servidor de correio é privado, local ou reservado e não é permitido.'
    host_unresolvable: 'O nome do host deste servidor de correio não é resolvido.'
    option_not_allowed: 'Uma opção deste DSN não é permitida (região fora da lista do fornecedor ou um valor que poderia mudar o endereço do servidor).'
    insecure_tls: 'Este DSN desativa a verificação de certificados TLS (verify_peer); só é permitido com dsn.allow_insecure_tls em desenvolvimento.'
